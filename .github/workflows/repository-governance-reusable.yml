name: NeoGenesis Repository Governance

on:
  workflow_call:
    inputs:
      self_test_only:
        description: Run validator invariants without evaluating the caller repository.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  governance:
    name: repository-governance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out caller exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Validate contract, GitHub settings, and tracked content
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SELF_TEST_ONLY: ${{ inputs.self_test_only }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import urllib.request
          from collections.abc import Mapping

          root = pathlib.Path('.')
          repository = os.environ.get('REPOSITORY', '')
          token = os.environ.get('GH_TOKEN', '')
          self_test_only = os.environ.get('SELF_TEST_ONLY', '').lower() == 'true'
          errors: list[str] = []

          secret_patterns: tuple[tuple[str, re.Pattern[str]], ...] = (
              ('GitHub classic token', re.compile(
                  r'(?<![A-Za-z0-9_])gh[pousr]_[A-Za-z0-9]{36,255}(?![A-Za-z0-9])'
              )),
              ('GitHub fine-grained token', re.compile(
                  r'(?<![A-Za-z0-9_])github_pat_[A-Za-z0-9_]{40,255}(?![A-Za-z0-9_])'
              )),
              ('OpenAI project or service key', re.compile(
                  r'(?<![A-Za-z0-9_-])sk-(?:proj|svcacct)-[A-Za-z0-9_-]{20,255}'
                  r'(?![A-Za-z0-9_-])'
              )),
              ('OpenAI legacy key', re.compile(
                  r'(?<![A-Za-z0-9_-])sk-[A-Za-z0-9]{32,255}(?![A-Za-z0-9_-])'
              )),
              ('Anthropic key', re.compile(
                  r'(?<![A-Za-z0-9_-])sk-ant-[A-Za-z0-9_-]{20,255}(?![A-Za-z0-9_-])'
              )),
              ('xAI key', re.compile(
                  r'(?<![A-Za-z0-9_-])xai-[A-Za-z0-9_-]{20,255}(?![A-Za-z0-9_-])'
              )),
              ('AWS access key', re.compile(
                  r'(?<![0-9A-Z])AKIA[0-9A-Z]{16}(?![0-9A-Z])'
              )),
              ('Google API key', re.compile(
                  r'(?<![0-9A-Za-z_-])AIza[0-9A-Za-z_-]{35}(?![0-9A-Za-z_-])'
              )),
              ('Slack token', re.compile(
                  r'(?<![0-9A-Za-z-])xox[baprs]-[0-9A-Za-z-]{20,255}(?![0-9A-Za-z-])'
              )),
              ('Stripe live secret', re.compile(
                  r'(?<![0-9A-Za-z_])sk_live_[0-9A-Za-z]{16,255}(?![0-9A-Za-z])'
              )),
              ('Hugging Face token', re.compile(
                  r'(?<![0-9A-Za-z_])hf_[0-9A-Za-z]{30,255}(?![0-9A-Za-z])'
              )),
              ('Private key header', re.compile(
                  r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
              )),
          )

          def matching_secret_labels(line: str) -> list[str]:
              return [label for label, pattern in secret_patterns if pattern.search(line)]

          def setting_finding(
              settings: Mapping[str, object], key: str, expected: bool
          ) -> str | None:
              if key not in settings or type(settings.get(key)) is not bool:
                  return f'repository setting {key} is UNVERIFIED (field unavailable)'
              actual = settings[key]
              if actual is not expected:
                  return f'repository setting {key} must be {expected}, got {actual}'
              return None

          def run_validator_self_tests() -> None:
              negatives = (
                  'task-execution-listener.ts',
                  'risk-classification',
                  'desktop-task-service',
                  'mask-sensitive-value',
                  'desk-state',
                  'ask-followup-question',
                  'the sk-prefix is discussed without a credential',
              )
              for line in negatives:
                  labels = matching_secret_labels(line)
                  if labels:
                      raise AssertionError(f'false-positive match for {line!r}: {labels}')

              positives = {
                  'GitHub classic token': 'ghp_' + ('A1' * 18),
                  'GitHub fine-grained token': 'github_pat_' + ('A1_' * 14),
                  'OpenAI project or service key': 'sk-' + 'proj-' + ('A1_' * 10),
                  'OpenAI legacy key': 'sk-' + ('A1' * 16),
                  'Anthropic key': 'sk-' + 'ant-' + ('A1_' * 10),
                  'xAI key': 'xai-' + ('A1_' * 10),
                  'AWS access key': 'AKIA' + ('A1' * 8),
                  'Google API key': 'AIza' + ('A1_' * 11) + 'A1',
                  'Slack token': 'xoxb-' + ('A1-' * 8),
                  'Stripe live secret': 'sk_' + 'live_' + ('A1' * 8),
                  'Hugging Face token': 'hf_' + ('A1' * 15),
                  'Private key header': '-----BEGIN ' + 'PRIVATE' + ' KEY-----',
              }
              for expected, line in positives.items():
                  observed = matching_secret_labels(line)
                  if expected not in observed:
                      raise AssertionError(
                          f'secret detector missed synthetic {expected}: {observed}'
                      )

              expected_unverified = (
                  'repository setting allow_squash_merge is UNVERIFIED '
                  '(field unavailable)'
              )
              if setting_finding({}, 'allow_squash_merge', True) != expected_unverified:
                  raise AssertionError('missing setting did not remain UNVERIFIED')
              if setting_finding(
                  {'allow_squash_merge': None}, 'allow_squash_merge', True
              ) != expected_unverified:
                  raise AssertionError('null setting did not remain UNVERIFIED')
              if setting_finding(
                  {'allow_squash_merge': False}, 'allow_squash_merge', True
              ) != 'repository setting allow_squash_merge must be True, got False':
                  raise AssertionError('confirmed mismatch was not rejected')
              if setting_finding(
                  {'allow_squash_merge': True}, 'allow_squash_merge', True
              ) is not None:
                  raise AssertionError('matching setting was rejected')

          run_validator_self_tests()
          if self_test_only:
              print('repository-governance validator self-test PASS')
              raise SystemExit(0)

          allowlist_path = root / '.github' / 'repository-governance-allowlist.json'
          allowlist: dict[str, object] = {}
          if allowlist_path.is_file():
              try:
                  value = json.loads(allowlist_path.read_text(encoding='utf-8'))
                  if not isinstance(value, dict):
                      raise ValueError('root must be an object')
                  allowlist = value
              except Exception as exc:
                  errors.append(f'invalid governance allowlist: {type(exc).__name__}')

          allowed_paths = {
              str(value) for value in allowlist.get('allowedPaths', [])
              if isinstance(value, str)
          }
          allowed_findings = {
              str(value) for value in allowlist.get('allowedFindings', [])
              if isinstance(value, str)
          }

          def record(message: str, path: str | None = None) -> None:
              if path and path in allowed_paths:
                  return
              if message in allowed_findings:
                  return
              errors.append(message)

          settings: dict[str, object] = {}
          if not repository or not token or '/' not in repository:
              record(
                  'repository settings are UNVERIFIED: '
                  'repository identity or GitHub token unavailable'
              )
          else:
              owner, name = repository.split('/', 1)
              query = '''
              query RepositoryGovernance($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  defaultBranchRef { name }
                  squashMergeAllowed
                  mergeCommitAllowed
                  rebaseMergeAllowed
                  deleteBranchOnMerge
                  allowUpdateBranch
                  autoMergeAllowed
                }
              }
              '''
              request = urllib.request.Request(
                  'https://api.github.com/graphql',
                  data=json.dumps({
                      'query': query,
                      'variables': {'owner': owner, 'name': name},
                  }).encode('utf-8'),
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'neogenesis-repository-governance',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  graph_errors = payload.get('errors') if isinstance(payload, dict) else None
                  repo_data = (
                      payload.get('data', {}).get('repository')
                      if isinstance(payload, dict)
                      and isinstance(payload.get('data'), dict)
                      else None
                  )
                  if graph_errors or not isinstance(repo_data, dict):
                      record('repository settings are UNVERIFIED: GraphQL read failed')
                  else:
                      default_ref = repo_data.get('defaultBranchRef')
                      settings = {
                          'allow_squash_merge': repo_data.get('squashMergeAllowed'),
                          'allow_merge_commit': repo_data.get('mergeCommitAllowed'),
                          'allow_rebase_merge': repo_data.get('rebaseMergeAllowed'),
                          'delete_branch_on_merge': repo_data.get('deleteBranchOnMerge'),
                          'allow_update_branch': repo_data.get('allowUpdateBranch'),
                          'allow_auto_merge': repo_data.get('autoMergeAllowed'),
                          'default_branch': (
                              default_ref.get('name')
                              if isinstance(default_ref, dict)
                              else None
                          ),
                      }
              except Exception as exc:
                  record(
                      f'repository settings are UNVERIFIED: GraphQL '
                      f'{type(exc).__name__}'
                  )

          contract = root / 'REPOSITORY_GOVERNANCE.md'
          if not contract.is_file():
              record('REPOSITORY_GOVERNANCE.md is missing')
          else:
              text = contract.read_text(encoding='utf-8', errors='replace')
              if 'ng-repo-governance/1.0.0' not in text:
                  record(
                      'repository contract does not identify policy '
                      'ng-repo-governance/1.0.0'
                  )
              normalized = text.replace('`', '').lower()
              if (
                  'unknown' not in normalized
                  or 'must never be reported as pass' not in normalized
              ):
                  record('repository contract does not define UNKNOWN as non-PASS')
              if 'presence of this file alone' not in normalized:
                  record(
                      'repository contract does not prohibit '
                      'documentation-only compliance'
                  )

          required_settings = {
              'allow_squash_merge': True,
              'allow_merge_commit': False,
              'allow_rebase_merge': False,
              'delete_branch_on_merge': True,
              'allow_update_branch': True,
              'allow_auto_merge': True,
          }
          for key, expected in required_settings.items():
              finding = setting_finding(settings, key, expected)
              if finding:
                  record(finding)

          default_value = settings.get('default_branch')
          if not isinstance(default_value, str) or not default_value:
              record('repository default branch is UNVERIFIED (field unavailable)')
              default_branch = ''
          else:
              default_branch = default_value

          approved_exceptions = {
              'NeoGenesisAI/neomux-desktop': 'einstein/main',
          }
          task_prefixes = (
              'codex/', 'rebuild/', 'feature/', 'fix/', 'chore/', 'governance/'
          )
          expected_exception = approved_exceptions.get(repository)
          if expected_exception and default_branch:
              if default_branch != expected_exception:
                  record(
                      'documented default-branch exception drifted: '
                      f'expected {expected_exception}, got {default_branch}'
                  )
          elif default_branch.startswith(task_prefixes):
              record(f'task branch is configured as repository default: {default_branch}')

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          tracked_paths = [
              value.decode('utf-8', errors='surrogateescape')
              for value in tracked if value
          ]

          allowed_env_names = {
              '.env.example', '.env.sample', '.env.template', '.env.local.example'
          }
          forbidden_names = {
              'credentials.json', 'service-account.json', 'service_account.json',
              'cookies.json', 'session.json', 'oauth.json', 'token.json'
          }
          forbidden_suffixes = (
              '.pem', '.p12', '.pfx', '.keystore', '.jks', '.mobileprovision'
          )
          generated_parts = {
              'node_modules', '__pycache__', '.venv', 'venv', '.next',
              'coverage', 'Library', 'Temp', 'obj', '.gradle'
          }
          generated_paths: set[str] = set()

          for raw in tracked_paths:
              path = pathlib.PurePosixPath(raw)
              name = path.name
              parts = set(path.parts)
              if name == '.env' or (
                  name.startswith('.env.') and name not in allowed_env_names
              ):
                  record(f'prohibited environment file is tracked: {raw}', raw)
              if name in forbidden_names or name.endswith(forbidden_suffixes):
                  record(f'prohibited credential or signing file is tracked: {raw}', raw)
              generated = sorted(parts & generated_parts)
              if generated:
                  generated_paths.add(f'{generated[0]} in {raw}')

          for generated_path in sorted(generated_paths):
              record(f'generated or dependency directory is tracked: {generated_path}')

          text_extensions = {
              '.txt', '.md', '.json', '.jsonc', '.yaml', '.yml', '.toml', '.ini',
              '.env', '.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs', '.py', '.rb',
              '.php', '.go', '.rs', '.java', '.kt', '.kts', '.cs', '.swift', '.sh',
              '.bash', '.zsh', '.ps1', '.xml', '.html', '.css', '.scss', '.sql',
              '.gradle', '.properties', '.conf', '.config'
          }
          special_text_names = {'Dockerfile', 'Makefile', 'Gemfile', 'Podfile'}

          for raw in tracked_paths:
              path = root / raw
              pure_path = pathlib.PurePosixPath(raw)
              if raw in allowed_paths or set(pure_path.parts) & generated_parts:
                  continue
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              if (
                  path.suffix.lower() not in text_extensions
                  and path.name not in special_text_names
              ):
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(content.splitlines(), start=1):
                  for label in matching_secret_labels(line):
                      record(f'{label} pattern detected at {raw}:{line_number}', raw)

          unique_errors = sorted(set(errors))
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          summary_lines = [
              '## Repository governance result',
              '',
              f'- Repository: `{repository or "UNAVAILABLE"}`',
              f'- Findings: `{len(unique_errors)}`',
              '- Validator self-tests: `PASS`',
          ]
          if unique_errors:
              summary_lines.extend(['', '### Fail-closed findings', ''])
              summary_lines.extend(f'- `{item}`' for item in unique_errors)
          if summary_path:
              pathlib.Path(summary_path).write_text(
                  '\n'.join(summary_lines) + '\n', encoding='utf-8'
              )

          if unique_errors:
              for item in unique_errors:
                  print(f'::error::{item}')
              print(
                  f'repository-governance failed with '
                  f'{len(unique_errors)} unique finding(s)',
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print('repository-governance PASS')
          PY

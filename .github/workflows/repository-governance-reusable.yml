name: NeoGenesis Repository Governance

on:
  workflow_call:
    inputs:
      self_test_only:
        description: Run validator invariants without evaluating the caller repository.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  governance:
    name: repository-governance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out caller exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Validate contract, GitHub settings, and tracked content
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SELF_TEST_ONLY: ${{ inputs.self_test_only }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import urllib.request
          from collections.abc import Mapping

          root = pathlib.Path('.')
          repository = os.environ.get('REPOSITORY', '')
          token = os.environ.get('GH_TOKEN', '')
          self_test_only = os.environ.get('SELF_TEST_ONLY', '').lower() == 'true'
          errors: list[str] = []
          notes: list[str] = []

          # Prefix boundaries are mandatory. Without them, ordinary identifiers
          # such as task-execution, risk-register, desk-state and mask-value are
          # misclassified merely because they contain the substring "sk-".
          secret_patterns: tuple[tuple[str, re.Pattern[str]], ...] = (
              (
                  'GitHub classic token',
                  re.compile(r'(?<![A-Za-z0-9_])gh[pousr]_[A-Za-z0-9]{36,255}(?![A-Za-z0-9])'),
              ),
              (
                  'GitHub fine-grained token',
                  re.compile(r'(?<![A-Za-z0-9_])github_pat_[A-Za-z0-9_]{40,255}(?![A-Za-z0-9_])'),
              ),
              (
                  'OpenAI project or service key',
                  re.compile(
                      r'(?<![A-Za-z0-9_-])sk-(?:proj|svcacct)-[A-Za-z0-9_-]{20,255}'
                      r'(?![A-Za-z0-9_-])'
                  ),
              ),
              (
                  'OpenAI legacy key',
                  re.compile(r'(?<![A-Za-z0-9_-])sk-[A-Za-z0-9]{32,255}(?![A-Za-z0-9_-])'),
              ),
              (
                  'Anthropic key',
                  re.compile(r'(?<![A-Za-z0-9_-])sk-ant-[A-Za-z0-9_-]{20,255}(?![A-Za-z0-9_-])'),
              ),
              (
                  'xAI key',
                  re.compile(r'(?<![A-Za-z0-9_-])xai-[A-Za-z0-9_-]{20,255}(?![A-Za-z0-9_-])'),
              ),
              (
                  'AWS access key',
                  re.compile(r'(?<![0-9A-Z])AKIA[0-9A-Z]{16}(?![0-9A-Z])'),
              ),
              (
                  'Google API key',
                  re.compile(r'(?<![0-9A-Za-z_-])AIza[0-9A-Za-z_-]{35}(?![0-9A-Za-z_-])'),
              ),
              (
                  'Slack token',
                  re.compile(r'(?<![0-9A-Za-z-])xox[baprs]-[0-9A-Za-z-]{20,255}(?![0-9A-Za-z-])'),
              ),
              (
                  'Stripe live secret',
                  re.compile(r'(?<![0-9A-Za-z_])sk_live_[0-9A-Za-z]{16,255}(?![0-9A-Za-z])'),
              ),
              (
                  'Hugging Face token',
                  re.compile(r'(?<![0-9A-Za-z_])hf_[0-9A-Za-z]{30,255}(?![0-9A-Za-z])'),
              ),
              (
                  'Private key header',
                  re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              ),
          )

          def matching_secret_labels(line: str) -> list[str]:
              return [label for label, pattern in secret_patterns if pattern.search(line)]

          def setting_finding(settings: Mapping[str, object], key: str, expected: bool) -> str | None:
              if key not in settings or type(settings.get(key)) is not bool:
                  return f'repository setting {key} is UNVERIFIED (field unavailable)'
              actual = settings[key]
              if actual is not expected:
                  return f'repository setting {key} must be {expected}, got {actual}'
              return None

          def run_validator_self_tests() -> None:
              negative_lines = (
                  'task-execution-listener.ts',
                  'risk-classification',
                  'desktop-task-service',
                  'mask-sensitive-value',
                  'desk-state',
                  'ask-followup-question',
                  'the sk-prefix is discussed without a credential',
              )
              for line in negative_lines:
                  labels = matching_secret_labels(line)
                  if labels:
                      raise AssertionError(f'false-positive secret match for {line!r}: {labels}')

              positive_lines = {
                  'GitHub classic token': 'ghp_' + ('A1' * 18),
                  'GitHub fine-grained token': 'github_pat_' + ('A1_' * 14),
                  'OpenAI project or service key': 'sk-' + 'proj-' + ('A1_' * 10),
                  'OpenAI legacy key': 'sk-' + ('A1' * 16),
                  'Anthropic key': 'sk-' + 'ant-' + ('A1_' * 10),
                  'xAI key': 'xai-' + ('A1_' * 10),
                  'AWS access key': 'AKIA' + ('A1' * 8),
                  'Google API key': 'AIza' + ('A1_' * 11) + 'A1',
                  'Slack token': 'xoxb-' + ('A1-' * 8),
                  'Stripe live secret': 'sk_' + 'live_' + ('A1' * 8),
                  'Hugging Face token': 'hf_' + ('A1' * 15),
                  'Private key header': '-----BEGIN PRIVATE KEY-----',
              }
              for expected_label, line in positive_lines.items():
                  labels = matching_secret_labels(line)
                  if expected_label not in labels:
                      raise AssertionError(
                          f'secret detector missed synthetic {expected_label}: observed={labels}'
                      )

              if setting_finding({}, 'allow_squash_merge', True) != (
                  'repository setting allow_squash_merge is UNVERIFIED (field unavailable)'
              ):
                  raise AssertionError('missing repository setting did not remain UNVERIFIED')
              if setting_finding({'allow_squash_merge': None}, 'allow_squash_merge', True) != (
                  'repository setting allow_squash_merge is UNVERIFIED (field unavailable)'
              ):
                  raise AssertionError('null repository setting did not remain UNVERIFIED')
              if setting_finding({'allow_squash_merge': False}, 'allow_squash_merge', True) != (
                  'repository setting allow_squash_merge must be True, got False'
              ):
                  raise AssertionError('confirmed repository setting mismatch was not rejected')
              if setting_finding({'allow_squash_merge': True}, 'allow_squash_merge', True) is not None:
                  raise AssertionError('matching repository setting was rejected')

          run_validator_self_tests()
          if self_test_only:
              print('repository-governance validator self-test PASS')
              raise SystemExit(0)

          allowlist_path = root / '.github' / 'repository-governance-allowlist.json'
          allowlist: dict[str, object] = {}
          if allowlist_path.is_file():
              try:
                  allowlist = json.loads(allowlist_path.read_text(encoding='utf-8'))
                  if not isinstance(allowlist, dict):
                      raise ValueError('root must be an object')
              except Exception as exc:
                  errors.append(f'invalid governance allowlist: {type(exc).__name__}')
                  allowlist = {}

          allowed_paths = {
              str(value) for value in allowlist.get('allowedPaths', [])
              if isinstance(value, str)
          }
          allowed_findings = {
              str(value) for value in allowlist.get('allowedFindings', [])
              if isinstance(value, str)
          }

          def record(message: str, path: str | None = None) -> None:
              if path and path in allowed_paths:
                  return
              if message in allowed_findings:
                  return
              errors.append(message)

          settings: dict[str, object] = {}
          if not repository or not token:
              record('repository settings are UNVERIFIED: repository identity or GitHub token unavailable')
          else:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'neogenesis-repository-governance',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      value = json.load(response)
                      if isinstance(value, dict):
                          settings = value
                      else:
                          record('repository settings are UNVERIFIED: API response is not an object')
              except Exception as exc:
                  record(f'repository settings are UNVERIFIED: {type(exc).__name__}')

          contract = root / 'REPOSITORY_GOVERNANCE.md'
          if not contract.is_file():
              record('REPOSITORY_GOVERNANCE.md is missing')
          else:
              text = contract.read_text(encoding='utf-8', errors='replace')
              if 'ng-repo-governance/1.0.0' not in text:
                  record('repository contract does not identify policy ng-repo-governance/1.0.0')
              normalized = text.replace('`', '').lower()
              if 'unknown' not in normalized or 'must never be reported as pass' not in normalized:
                  record('repository contract does not define UNKNOWN as non-PASS')
              if 'presence of this file alone' not in normalized:
                  record('repository contract does not prohibit documentation-only compliance')

          required_settings = {
              'allow_squash_merge': True,
              'allow_merge_commit': False,
              'allow_rebase_merge': False,
              'delete_branch_on_merge': True,
              'allow_update_branch': True,
              'allow_auto_merge': True,
          }
          for key, expected in required_settings.items():
              finding = setting_finding(settings, key, expected)
              if finding:
                  record(finding)

          default_branch_value = settings.get('default_branch')
          if not isinstance(default_branch_value, str) or not default_branch_value:
              record('repository default branch is UNVERIFIED (field unavailable)')
              default_branch = ''
          else:
              default_branch = default_branch_value

          approved_exceptions = {
              'NeoGenesisAI/neomux-desktop': 'einstein/main',
          }
          task_prefixes = ('codex/', 'rebuild/', 'feature/', 'fix/', 'chore/', 'governance/')
          expected_exception = approved_exceptions.get(repository)
          if expected_exception and default_branch:
              if default_branch != expected_exception:
                  record(
                      f'documented default-branch exception drifted: expected {expected_exception}, got {default_branch}'
                  )
          elif default_branch.startswith(task_prefixes):
              record(f'task branch is configured as repository default: {default_branch}')

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          tracked_paths = [p.decode('utf-8', errors='surrogateescape') for p in tracked if p]

          allowed_env_names = {
              '.env.example', '.env.sample', '.env.template', '.env.local.example'
          }
          forbidden_names = {
              'credentials.json', 'service-account.json', 'service_account.json',
              'cookies.json', 'session.json', 'oauth.json', 'token.json'
          }
          forbidden_suffixes = (
              '.pem', '.p12', '.pfx', '.keystore', '.jks', '.mobileprovision'
          )
          generated_parts = {
              'node_modules', '__pycache__', '.venv', 'venv', '.next',
              'coverage', 'Library', 'Temp', 'obj', '.gradle'
          }
          generated_paths: set[str] = set()

          for raw in tracked_paths:
              path = pathlib.PurePosixPath(raw)
              name = path.name
              parts = set(path.parts)
              if name == '.env' or (name.startswith('.env.') and name not in allowed_env_names):
                  record(f'prohibited environment file is tracked: {raw}', raw)
              if name in forbidden_names or name.endswith(forbidden_suffixes):
                  record(f'prohibited credential or signing file is tracked: {raw}', raw)
              matching_generated = sorted(parts & generated_parts)
              if matching_generated:
                  generated_paths.add(f'{matching_generated[0]} in {raw}')

          for generated_path in sorted(generated_paths):
              record(f'generated or dependency directory is tracked: {generated_path}')

          text_extensions = {
              '.txt', '.md', '.json', '.jsonc', '.yaml', '.yml', '.toml', '.ini',
              '.env', '.js', '.jsx', '.ts', '.tsx', '.mjs', '.cjs', '.py', '.rb',
              '.php', '.go', '.rs', '.java', '.kt', '.kts', '.cs', '.swift', '.sh',
              '.bash', '.zsh', '.ps1', '.xml', '.html', '.css', '.scss', '.sql',
              '.gradle', '.properties', '.conf', '.config'
          }

          for raw in tracked_paths:
              path = root / raw
              pure_path = pathlib.PurePosixPath(raw)
              if raw in allowed_paths or set(pure_path.parts) & generated_parts:
                  continue
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              if path.suffix.lower() not in text_extensions and path.name not in {
                  'Dockerfile', 'Makefile', 'Gemfile', 'Podfile'
              }:
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(content.splitlines(), start=1):
                  for label in matching_secret_labels(line):
                      record(f'{label} pattern detected at {raw}:{line_number}', raw)

          unique_errors = sorted(set(errors))
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          summary_lines = [
              '## Repository governance result',
              '',
              f'- Repository: `{repository or "UNAVAILABLE"}`',
              f'- Findings: `{len(unique_errors)}`',
              '- Validator self-tests: `PASS`',
          ]
          if unique_errors:
              summary_lines.extend(['', '### Fail-closed findings', ''])
              summary_lines.extend(f'- `{item}`' for item in unique_errors)
          if notes:
              summary_lines.extend(['', '### Notes', ''])
              summary_lines.extend(f'- {item}' for item in notes)
          if summary_path:
              pathlib.Path(summary_path).write_text('\n'.join(summary_lines) + '\n', encoding='utf-8')

          if unique_errors:
              for item in unique_errors:
                  print(f'::error::{item}')
              print(
                  f'repository-governance failed with {len(unique_errors)} unique finding(s)',
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print('repository-governance PASS')
          PY

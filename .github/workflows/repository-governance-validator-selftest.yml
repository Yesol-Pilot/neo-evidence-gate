name: Repository Governance Validator Self-test

on:
  pull_request:
    paths:
      - ".github/workflows/repository-governance-reusable.yml"
      - ".github/workflows/repository-governance-validator-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-validator-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validator-self-test:
    uses: ./.github/workflows/repository-governance-reusable.yml
    with:
      self_test_only: true
